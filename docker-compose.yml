services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compras}
      POSTGRES_DB: ${POSTGRES_DB:-compras}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts desta pasta rodam na primeira inicialização (volume vazio)
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: ./mcp_server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compras}:${POSTGRES_PASSWORD:-compras}@db:5432/${POSTGRES_DB:-compras}
      DUMMYJSON_URL: ${DUMMYJSON_URL:-https://dummyjson.com}
      DUMMYJSON_TIMEOUT: ${DUMMYJSON_TIMEOUT:-5}
      MCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
