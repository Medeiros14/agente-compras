services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compras}
      POSTGRES_DB: ${POSTGRES_DB:-compras}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts desta pasta rodam na primeira inicialização (volume vazio)
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: ./mcp_server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compras}:${POSTGRES_PASSWORD:-compras}@db:5432/${POSTGRES_DB:-compras}
      DUMMYJSON_URL: ${DUMMYJSON_URL:-https://dummyjson.com}
      DUMMYJSON_TIMEOUT: ${DUMMYJSON_TIMEOUT:-5}
      MCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-5.5}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      AGENTE_MAX_ITERACOES: ${AGENTE_MAX_ITERACOES:-8}
      MCP_URL: http://mcp:8001/mcp
      DATABASE_URL: postgresql://${POSTGRES_USER:-compras}:${POSTGRES_PASSWORD:-compras}@db:5432/${POSTGRES_DB:-compras}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
