server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o endereço numa variável, o nginx resolve
    # "backend" a cada requisição (e não só ao subir), então continua
    # funcionando se o container do backend for recriado e mudar de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Chamadas da tela vão para o backend pela rede do compose (sem CORS).
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;   # remove o prefixo /api
        proxy_pass $backend;
        proxy_set_header Host $host;
        # O agente pode fazer várias chamadas ao LLM: dá tempo para ele terminar.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
