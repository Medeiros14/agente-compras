server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Chamadas da tela vão para o backend pela rede do compose (sem CORS).
    # A barra final em proxy_pass remove o prefixo /api.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # O agente pode fazer várias chamadas ao LLM: dá tempo para ele terminar.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
